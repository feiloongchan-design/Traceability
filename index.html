<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traceability Checklist</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --success: #16a34a;
      --bg: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
      --checked-bg: #f0fdf4;
      --checked-border: #bbf7d0;
      --radius: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
    }

    header p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    /* Progress bar */
    .progress-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .progress-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    .progress-bar-wrap {
      flex: 1;
      background: var(--border);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--success);
      border-radius: 999px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .progress-pct {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--success);
      min-width: 3rem;
      text-align: right;
    }

    /* Add item form */
    .add-form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .add-form input[type="text"] {
      flex: 1;
      min-width: 200px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.55rem 0.85rem;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .add-form input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .add-form select {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.55rem 0.75rem;
      font-size: 0.95rem;
      color: var(--text);
      background: var(--card);
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .add-form select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      border: none;
      border-radius: var(--radius);
      padding: 0.55rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      text-decoration: none;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover { background: var(--primary-hover); }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      padding: 0.35rem 0.5rem;
    }

    .btn-danger:hover { background: #fee2e2; }

    .btn-outline {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-outline:hover { background: var(--bg); }

    /* Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-tabs {
      display: flex;
      gap: 0.4rem;
    }

    .filter-tab {
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      transition: all 0.15s;
    }

    .filter-tab.active, .filter-tab:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .toolbar-actions {
      display: flex;
      gap: 0.5rem;
    }

    /* Category sections */
    .category-section {
      margin-bottom: 1.25rem;
    }

    .category-header {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0.4rem 0;
      margin-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    /* Checklist items */
    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .checklist-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      transition: background 0.2s, border-color 0.2s;
    }

    .checklist-item.done {
      background: var(--checked-bg);
      border-color: var(--checked-border);
    }

    .checklist-item input[type="checkbox"] {
      width: 1.2rem;
      height: 1.2rem;
      flex-shrink: 0;
      accent-color: var(--success);
      cursor: pointer;
    }

    .item-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .item-label {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text);
      transition: color 0.2s, text-decoration 0.2s;
    }

    .checklist-item.done .item-label {
      text-decoration: line-through;
      color: var(--muted);
    }

    .item-meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .category-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      background: #e0e7ff;
      color: #3730a3;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .empty-state svg {
      opacity: 0.35;
      margin-bottom: 0.75rem;
    }

    .empty-state p {
      font-size: 0.95rem;
    }

    /* Export modal overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.5rem;
      max-width: 540px;
      width: 90%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }

    .modal h2 {
      font-size: 1.15rem;
      margin-bottom: 1rem;
    }

    .modal textarea {
      width: 100%;
      height: 200px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.75rem;
      font-family: monospace;
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Traceability Checklist</h1>
      <p>Track and verify every requirement — no paper checklist needed.</p>
    </header>

    <!-- Progress -->
    <div class="progress-card">
      <span class="progress-label">Progress</span>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>

    <!-- Add item form -->
    <form class="add-form" id="addForm">
      <input
        type="text"
        id="newItemText"
        placeholder="Add a checklist item&hellip;"
        aria-label="New checklist item text"
        autocomplete="off"
        required
      />
      <select id="newItemCategory" aria-label="Category">
        <option value="General">General</option>
        <option value="Requirements">Requirements</option>
        <option value="Design">Design</option>
        <option value="Implementation">Implementation</option>
        <option value="Testing">Testing</option>
        <option value="Review">Review</option>
        <option value="Deployment">Deployment</option>
      </select>
      <button type="submit" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Item
      </button>
    </form>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="pending">Pending</button>
        <button class="filter-tab" data-filter="done">Done</button>
      </div>
      <div class="toolbar-actions">
        <button class="btn btn-outline" id="clearDoneBtn" aria-label="Clear all completed checklist items">Clear Done</button>
        <button class="btn btn-outline" id="exportBtn" aria-label="Export checklist as JSON">Export</button>
        <button class="btn btn-danger" id="clearAllBtn" aria-label="Clear all checklist items">Clear All</button>
      </div>
    </div>

    <!-- Checklist output -->
    <div id="listContainer"></div>
  </div>

  <!-- Confirm modal -->
  <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <div class="modal">
      <h2 id="confirmTitle">Confirm</h2>
      <p id="confirmMessage" style="margin-bottom:1.25rem;color:var(--muted);font-size:0.95rem;"></p>
      <div class="modal-actions">
        <button class="btn btn-outline" id="confirmCancelBtn">Cancel</button>
        <button class="btn btn-danger" id="confirmOkBtn">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" role="alert" aria-live="assertive" style="
    position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(80px);
    background:#1e293b;color:#fff;padding:0.6rem 1.2rem;border-radius:999px;
    font-size:0.875rem;font-weight:500;opacity:0;transition:opacity 0.25s,transform 0.25s;
    pointer-events:none;z-index:200;"></div>

  <!-- Export modal -->
  <div class="modal-overlay" id="exportModal" role="dialog" aria-modal="true" aria-label="Export checklist">
    <div class="modal">
      <h2>Export Checklist (JSON)</h2>
      <textarea id="exportText" readonly></textarea>
      <div class="modal-actions">
        <button class="btn btn-outline" id="copyExportBtn">Copy</button>
        <button class="btn btn-primary" id="closeModalBtn">Close</button>
      </div>
    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    const STORAGE_KEY = 'traceability-checklist-v1';
    let items = [];        // { id, text, category, done, createdAt }
    let filter = 'all';    // 'all' | 'pending' | 'done'

    // ── Persistence ───────────────────────────────────────────────────────────
    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (err) {
        const detail = err ? (err.message || err.name || 'storage error') : 'storage error';
        showToast('Could not save: ' + detail);
      }
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) items = JSON.parse(raw);
      } catch (err) {
        console.error('[Traceability] Failed to load saved data:', err);
        showToast('Could not load saved data — starting fresh.');
        items = [];
      }
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function genId() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      // Fallback for environments without crypto.randomUUID (very old browsers).
      // Uses getRandomValues when available for stronger entropy; otherwise
      // relies on Math.random. IDs are long enough to make collisions negligible.
      if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
        const buf = new Uint32Array(4);
        crypto.getRandomValues(buf);
        return Array.from(buf, n => n.toString(16).padStart(8, '0')).join('');
      }
      return Date.now().toString(36)
        + Math.random().toString(36).slice(2)
        + Math.random().toString(36).slice(2)
        + Math.random().toString(36).slice(2);
    }

    function fmt(iso) {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    // ── Toast notification ────────────────────────────────────────────────────
    let toastTimer;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.style.opacity = '1';
      el.style.transform = 'translateX(-50%) translateY(0)';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(-50%) translateY(80px)';
      }, 3000);
    }

    // ── Confirm modal ─────────────────────────────────────────────────────────
    function showConfirm(message, onOk) {
      document.getElementById('confirmMessage').textContent = message;
      document.getElementById('confirmModal').classList.add('open');
      const okBtn = document.getElementById('confirmOkBtn');
      const cancelBtn = document.getElementById('confirmCancelBtn');
      function close() {
        document.getElementById('confirmModal').classList.remove('open');
        okBtn.removeEventListener('click', handleOk);
        cancelBtn.removeEventListener('click', handleCancel);
      }
      function handleOk() {
        close();
        try { onOk(); } catch (err) { console.error('[Traceability] Confirm callback error:', err); }
      }
      function handleCancel() { close(); }
      okBtn.addEventListener('click', handleOk);
      cancelBtn.addEventListener('click', handleCancel);
    }

    // ── Render ────────────────────────────────────────────────────────────────
    function render() {
      const container = document.getElementById('listContainer');
      const visible = items.filter(it => {
        if (filter === 'pending') return !it.done;
        if (filter === 'done')    return  it.done;
        return true;
      });

      updateProgress();

      if (visible.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="16" rx="2"/>
              <polyline points="9 11 12 14 20 6"/>
            </svg>
            <p>No items here — add one above!</p>
          </div>`;
        return;
      }

      // Group by category
      const groups = {};
      visible.forEach(it => {
        (groups[it.category] = groups[it.category] || []).push(it);
      });

      let html = '';
      Object.keys(groups).sort().forEach(cat => {
        html += `<div class="category-section">
          <div class="category-header">${escHtml(cat)}</div>
          <ul class="checklist">`;
        groups[cat].forEach(it => {
          html += `<li class="checklist-item${it.done ? ' done' : ''}" data-id="${it.id}">
            <input type="checkbox" id="cb-${it.id}" ${it.done ? 'checked' : ''} />
            <div class="item-content">
              <label class="item-label" for="cb-${it.id}">${escHtml(it.text)}</label>
              <span class="item-meta">Added ${fmt(it.createdAt)}</span>
            </div>
            <button class="btn btn-danger" data-delete="${it.id}" aria-label="Delete: ${escHtml(it.text)}" title="Delete">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </li>`;
        });
        html += `</ul></div>`;
      });

      container.innerHTML = html;
    }

    function updateProgress() {
      const total = items.length;
      const done  = items.filter(i => i.done).length;
      const pct   = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressPct').textContent  = pct + '%';
    }

    function escHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ── Event delegation for checklist interactions ────────────────────────────
    document.getElementById('listContainer').addEventListener('change', e => {
      if (e.target.type === 'checkbox') {
        const id = e.target.closest('.checklist-item').dataset.id;
        const item = items.find(i => i.id === id);
        if (item) { item.done = e.target.checked; save(); render(); }
      }
    });

    document.getElementById('listContainer').addEventListener('click', e => {
      const del = e.target.closest('[data-delete]');
      if (del) {
        const id = del.dataset.delete;
        const item = items.find(i => i.id === id);
        const label = item ? item.text : 'this item';
        showConfirm('Delete "' + label + '"?', () => {
          items = items.filter(i => i.id !== id);
          save();
          render();
        });
      }
    });

    // ── Add form ──────────────────────────────────────────────────────────────
    document.getElementById('addForm').addEventListener('submit', e => {
      e.preventDefault();
      const text = document.getElementById('newItemText').value.trim();
      const category = document.getElementById('newItemCategory').value;
      if (!text) return;
      items.push({ id: genId(), text, category, done: false, createdAt: new Date().toISOString() });
      save();
      render();
      document.getElementById('newItemText').value = '';
      document.getElementById('newItemText').focus();
    });

    // ── Filters ───────────────────────────────────────────────────────────────
    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
      });
    });

    // ── Toolbar actions ───────────────────────────────────────────────────────
    document.getElementById('clearDoneBtn').addEventListener('click', () => {
      items = items.filter(i => !i.done);
      save();
      render();
    });

    document.getElementById('clearAllBtn').addEventListener('click', () => {
      if (items.length === 0) return;
      showConfirm('Clear all items? This cannot be undone.', () => {
        items = [];
        save();
        render();
      });
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      document.getElementById('exportText').value = JSON.stringify(items, null, 2);
      document.getElementById('exportModal').classList.add('open');
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('exportModal').classList.remove('open');
    });

    document.getElementById('exportModal').addEventListener('click', e => {
      if (e.target === document.getElementById('exportModal')) {
        document.getElementById('exportModal').classList.remove('open');
      }
    });

    document.getElementById('copyExportBtn').addEventListener('click', () => {
      const ta = document.getElementById('exportText');
      ta.select();
      const btn = document.getElementById('copyExportBtn');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(() => {
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
        }).catch(() => {
          showToast('Could not copy to clipboard.');
        });
      } else {
        showToast('Clipboard API not supported in this browser.');
      }
    });

    // ── Keyboard: Escape closes modals ────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        document.getElementById('exportModal').classList.remove('open');
        document.getElementById('confirmModal').classList.remove('open');
      }
    });

    // ── Bootstrap ─────────────────────────────────────────────────────────────
    load();
    // Seed with default traceability checklist if empty
    if (items.length === 0) {
      const defaults = [
        { category: 'Requirements', text: 'Requirements documented and reviewed' },
        { category: 'Requirements', text: 'Acceptance criteria defined for each requirement' },
        { category: 'Design',       text: 'Architecture design approved' },
        { category: 'Design',       text: 'UI/UX mockups reviewed' },
        { category: 'Implementation', text: 'Code reviewed and approved' },
        { category: 'Implementation', text: 'Static analysis / linting passed' },
        { category: 'Testing',      text: 'Unit tests written and passing' },
        { category: 'Testing',      text: 'Integration tests passing' },
        { category: 'Testing',      text: 'Edge cases documented and tested' },
        { category: 'Review',       text: 'Security review completed' },
        { category: 'Review',       text: 'Accessibility review completed' },
        { category: 'Deployment',   text: 'Staging deployment verified' },
        { category: 'Deployment',   text: 'Release notes written' },
        { category: 'Deployment',   text: 'Production deployment approved' },
      ];
      defaults.forEach(d => {
        items.push({ id: genId(), text: d.text, category: d.category, done: false, createdAt: new Date().toISOString() });
      });
      save();
    }
    render();
  </script>
</body>
</html>
